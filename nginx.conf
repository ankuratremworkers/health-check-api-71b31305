server {
    listen 8000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unknown route. Asset paths resolve
    # directly via $uri because the reverse proxy in front has already stripped
    # the deployed prefix.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static build artifacts.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
